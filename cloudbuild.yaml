steps:
  # 1. Pull de la imagen previa para usarla como caché
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'docker pull us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/integra-rh-backend:latest || exit 0'

  # 2. Construir Docker CON BASH para asegurar que se expandan las variables y se inyecten en el código cliente
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker build \
          -t us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/integra-rh-backend:latest \
          --cache-from us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/integra-rh-backend:latest \
          --build-arg DATABASE_URL="$$DATABASE_URL" \
          --build-arg GOOGLE_MAPS_API_KEY="$$GOOGLE_MAPS_API_KEY" \
          -f Dockerfile.prod .
    secretEnv: ['DATABASE_URL', 'GOOGLE_MAPS_API_KEY']

  # 3. Push a Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/integra-rh-backend:latest'

  # 4. Deploy a Cloud Run - update-secrets y update-env-vars para NO TOCAR las variables existentes (Psicométricas, Firebase...)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'api'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/integra-rh-backend:latest'
      - '--region'
      - 'us-central1'
      - '--max-instances'
      - '25'
      - '--update-secrets=DATABASE_URL=DATABASE_URL:latest,GOOGLE_MAPS_API_KEY=GOOGLE_MAPS_API_KEY:latest'
      - '--update-env-vars=VITE_GOOGLE_MAPS_API_KEY=$$GOOGLE_MAPS_API_KEY'
    secretEnv: ['GOOGLE_MAPS_API_KEY']

  # 5. Extract dist from Docker Image for Firebase Hosting
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Crear contenedor temporal
        docker create --name extract us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/integra-rh-backend:latest
        
        # Eliminar dist viejo si existe y crear directorio
        rm -rf integra-rh-manus/dist
        mkdir -p integra-rh-manus/dist
        
        # Copiar assets construidos (que YA tienen la API Key quemada)
        docker cp extract:/app/dist/. integra-rh-manus/dist/
        
        # Limpiar
        docker rm extract
        
        echo "✅ Frontend extraído correctamente para Firebase Hosting"
        ls -R integra-rh-manus/dist

  # 6. Deploy Firebase & Functions
  - name: 'gcr.io/cloud-builders/firebase'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud secrets versions access latest --secret="FIREBASE_SA_KEY" > /tmp/firebase-sa.json
        export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
        firebase deploy --project=$PROJECT_ID --only hosting,functions

availableSecrets:
  secretManager:
  - versionName: projects/$PROJECT_ID/secrets/DATABASE_URL/versions/latest
    env: 'DATABASE_URL'
  - versionName: projects/$PROJECT_ID/secrets/GOOGLE_MAPS_API_KEY/versions/latest
    env: 'GOOGLE_MAPS_API_KEY'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/integra-rh-backend:latest'

timeout: '3600s'
