steps:
  # 1. Pull de la imagen previa para usarla como caché
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'docker pull us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/integra-rh-backend:latest || exit 0'

  # 2. NO compilar - usar la imagen previa ya compilada de api-00158-rgb
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'echo'
    args:
      - 'Skipping Docker build - using existing image from api-00158-rgb'

  # 3. NO hacer push - la imagen ya existe
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'echo'
    args:
      - 'Skipping push - image already in Artifact Registry'

  # 4. Deploy a Cloud Run - SOLO agregar VITE_GOOGLE_MAPS_API_KEY a la revisión estable
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'services'
      - 'update'
      - 'api'
      - '--region'
      - 'us-central1'
      - '--update-secrets=VITE_GOOGLE_MAPS_API_KEY=GOOGLE_MAPS_API_KEY:latest'

  # 5. Deploy Firebase & Functions
  - name: 'gcr.io/cloud-builders/firebase'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud secrets versions access latest --secret="FIREBASE_SA_KEY" > /tmp/firebase-sa.json
        export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
        firebase deploy --project=$PROJECT_ID --only hosting,functions

availableSecrets:
  secretManager:
  - versionName: projects/$PROJECT_ID/secrets/FIREBASE_SA_KEY/versions/latest
    env: 'FIREBASE_SA_KEY'
  - versionName: projects/$PROJECT_ID/secrets/DATABASE_URL/versions/latest
    env: 'DATABASE_URL'
  - versionName: projects/$PROJECT_ID/secrets/GOOGLE_MAPS_API_KEY/versions/latest
    env: 'GOOGLE_MAPS_API_KEY'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/integra-rh-backend:latest'

timeout: '3600s'
